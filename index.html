 $("#gb").innerHTML=`<div class="bg-fr-card border border-fr-bd rounded-2xl p-3"><h3 class="font-bold">E se…? Singapore</h3><p class="text-xs text-gray-400 mb-2">Scegli l'arrivo in Sprint (punti ai primi 8) e in Gara (primi 10).</p><div class="flex gap-2 mb-3"><button id="p1" class="chipb">Doppietta Ferrari</button><button id="p0" class="chipb">Azzera</button></div><div class="grid grid-cols-[1fr_64px_64px] gap-x-2 gap-y-1.5 items-center text-xs"><span></span><span class="text-gray-400">Sprint</span><span class="text-gray-400">Gara</span>${PD.map((d,i)=>`<span class="font-semibold">${d[0].split(" ").pop()}</span><select id="ps${i}" class="bg-fr-blk border border-fr-bd rounded-lg p-1.5">${op(8)}</select><select id="pg${i}" class="bg-fr-blk border border-fr-bd rounded-lg p-1.5">${op(10)}</select>`).join("")}</div></div><div id="pr" class="bg-fr-card border border-fr-bd rounded-2xl p-3 mt-3"></div>`;
 const u=()=>{const sv=PD.map((_,i)=>+$("#ps"+i).value),gv=PD.map((_,i)=>+$("#pg"+i).value);
  const dup=a=>a.filter(x=>x).some((x,i,r)=>r.indexOf(x)!=i);
  const rows=PD.map((d,i)=>({n:d[0],f:d[2],b:d[1],t:d[1]+(sv[i]?SPP[sv[i]-1]:0)+(gv[i]?GPP[gv[i]-1]:0),r0:i})).sort((a,b)=>b.t-a.t||a.r0-b.r0);
  $("#pr").innerHTML=(dup(sv)||dup(gv)?'<p class="text-[11px] text-fr-yel mb-2">⚠️ Due piloti hanno la stessa posizione.</p>':"")+rows.map((r,i)=>{const mv=r.r0-i;return `<div class="flex items-center gap-2 py-1.5 border-b border-fr-bd/50 text-sm ${r.f?'text-white font-bold':''}"><span class="w-6 text-gray-400">${i+1}°</span><span class="flex-1">${r.n}${r.f?' <span class="px-1 bg-fr-red text-[9px] rounded">F</span>':''}</span><span class="text-[11px] ${mv>0?'text-green-400':mv<0?'text-red-400':'text-gray-500'}">${mv>0?'▲'+mv:mv<0?'▼'+-mv:'='}</span><span class="w-16 text-right font-extrabold text-fr-yel">${r.t}</span><span class="w-10 text-right text-[11px] text-gray-400">+${r.t-r.b}</span></div>`}).join("")};
 PD.forEach((_,i)=>{$("#ps"+i).onchange=u;$("#pg"+i).onchange=u});
 const set=(a)=>{PD.forEach((_,i)=>{$("#ps"+i).value=a[i];$("#pg"+i).value=a[i]});u()};
 $("#p0").onclick=()=>set([0,0,0,0,0,0]);$("#p1").onclick=()=>set([3,4,2,1,5,6]);u()}

function render(){head();prog();strat();ris();wx();tabs();if(!window._pl){play();window._pl=1}}
render();tick();setInterval(tick,1000);
</script>
