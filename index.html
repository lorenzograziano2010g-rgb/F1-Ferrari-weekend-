<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scuderia Ferrari · Weekend Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{fr:{red:'#E8002D',yel:'#FFEB00',blk:'#10131a',card:'#1b1f28',bd:'#2f3542'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<style>
body{background-color:#12151c;color:#f3f4f6;font-family:'Inter',sans-serif;margin:0;padding-bottom:90px;-webkit-tap-highlight-color:transparent}
.pane{display:none}.pane.on{display:block}
.ns::-webkit-scrollbar{display:none}.ns{scrollbar-width:none}
</style>
</head>
<body class="antialiased">

<header class="sticky top-0 z-40 bg-fr-blk/95 backdrop-blur border-b border-fr-bd">
 <div class="h-1 bg-gradient-to-r from-fr-red via-fr-red to-fr-yel"></div>
 <div class="max-w-3xl mx-auto px-3 py-2">
  <div class="flex items-center gap-2 mb-2">
   <div class="w-8 h-8 bg-fr-red rounded-lg flex items-center justify-center font-bold">🏁</div>
   <div><div class="text-[10px] font-bold uppercase text-fr-yel">Scuderia Ferrari HP</div><h1 class="text-sm font-extrabold">F1 Hub 2026</h1></div>
  </div>
  <div id="wk" class="flex gap-2 overflow-x-auto ns pb-1"></div>
 </div>
</header>

<main class="max-w-3xl mx-auto px-3 py-3 space-y-3">
 <div id="hero" class="bg-fr-card border border-fr-bd rounded-2xl p-4"></div>

 <nav class="fixed bottom-0 left-0 right-0 z-40 bg-fr-blk/95 border-t border-fr-bd">
  <div class="max-w-3xl mx-auto grid grid-cols-4 text-center">
   <button onclick="setTab('prog')" id="btn-prog" class="py-3 text-xs font-bold text-fr-red border-t-2 border-fr-red">📅 Orari</button>
   <button onclick="setTab('camp')" id="btn-camp" class="py-3 text-xs font-bold text-gray-400 border-t-2 border-transparent">🏆 Classifica</button>
   <button onclick="setTab('wx')" id="btn-wx" class="py-3 text-xs font-bold text-gray-400 border-t-2 border-transparent">🌦️ Meteo</button>
   <button onclick="setTab('info')" id="btn-info" class="py-3 text-xs font-bold text-gray-400 border-t-2 border-transparent">ℹ️ Info</button>
  </div>
 </nav>

 <section id="p-prog" class="pane on space-y-2"></section>
 <section id="p-camp" class="pane space-y-3">
  <div class="bg-fr-card border border-fr-bd rounded-xl p-3">
   <h2 class="font-bold text-sm mb-2">Piloti 2026</h2>
   <table class="w-full text-xs">
    <tr><td class="py-1.5 font-bold">3°</td><td class="py-1.5 text-white">Lewis Hamilton (Ferrari)</td><td class="py-1.5 text-right font-bold text-fr-yel">214 pts</td></tr>
    <tr><td class="py-1.5 font-bold">4°</td><td class="py-1.5 text-white">Charles Leclerc (Ferrari)</td><td class="py-1.5 text-right font-bold text-fr-yel">191 pts</td></tr>
   </table>
  </div>
 </section>
 <section id="p-wx" class="pane space-y-3"></section>
 <section id="p-info" class="pane">
  <div class="bg-fr-card border border-fr-bd rounded-xl p-4 text-xs text-gray-300 space-y-2">
   <h2 class="font-bold text-sm text-white">Informazioni Hub</h2>
   <p>App creata per la Scuderia Ferrari. Gli orari si aggiornano automaticamente in base al GP selezionato in alto.</p>
  </div>
 </section>
</main>

<script>
const W={
 sg:{id:"sg",name:"Singapore",dates:"9–11 Ott",flag:"🇸🇬",lat:1.2914,lon:103.8644,sess:[["Prove Libere 1","Venerdì, 09:30"],["Qualifica Sprint","Venerdì, 13:30"],["Sprint Race","Sabato, 10:00"],["Qualifiche GP","Sabato, 14:00"],["Gran Premio","Domenica, 13:00"]]},
 usa:{id:"usa",name:"Austin",dates:"23–25 Ott",flag:"🇺🇸",lat:30.1328,lon:-97.6411,sess:[["Prove Libere 1","Venerdì, 18:30"],["Qualifica Sprint","Venerdì, 22:30"],["Sprint Race","Sabato, 18:00"],["Qualifiche GP","Sabato, 22:00"],["Gran Premio","Domenica, 19:00"]]},
 mex:{id:"mex",name:"Messico",dates:"30 Ott - 1 Nov",flag:"🇲🇽",lat:19.4042,lon:-99.0907,sess:[["Prove Libere 1","Venerdì, 18:30"],["Prove Libere 2","Venerdì, 22:00"],["Prove Libere 3","Sabato, 17:30"],["Qualifiche GP","Sabato, 21:00"],["Gran Premio","Domenica, 20:00"]]}
};

let curW="sg", curTab="prog";

function renderWk(){
 document.getElementById("wk").innerHTML=Object.values(W).map(w=>`
  <button onclick="curW='${w.id}';render()" class="shrink-0 px-3 py-2 rounded-xl border text-left ${w.id===curW?'bg-fr-red border-fr-red text-white':'bg-fr-card border-fr-bd text-gray-300'}">
   <div class="text-[10px] uppercase font-semibold">${w.flag} ${w.dates}</div>
   <div class="text-xs font-extrabold">${w.name}</div>
  </button>`).join("");
 
 const w=W[curW];
 document.getElementById("hero").innerHTML=`
  <div class="text-[10px] font-bold uppercase text-fr-yel">${w.flag} GP di ${w.name} (${w.dates})</div>
  <div class="text-base font-black mt-1">Weekend in corso</div>
  <div class="text-xs text-gray-400 mt-0.5">Orari ufficiali in ora italiana (CET/CEST)</div>`;

 document.getElementById("p-prog").innerHTML=w.sess.map(s=>`
  <div class="bg-fr-card border border-fr-bd rounded-xl p-3 flex justify-between items-center">
   <div class="text-sm font-bold">${s[0]}</div>
   <div class="text-xs font-black text-fr-yel bg-fr-blk px-2.5 py-1 rounded-lg border border-fr-bd">${s[1]}</div>
  </div>`).join("");
}

async function renderWx(){
 const w=W[curW];
 const box=document.getElementById("p-wx");
 box.innerHTML=`<div class="bg-fr-card border border-fr-bd rounded-xl p-4 text-center text-xs text-gray-400">Caricamento meteo...</div>`;
 try{
  const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&daily=temperature_2m_max,precipitation_probability_max&timezone=auto`);
  const data=await res.json();
  const days=data.daily.time.slice(0,3);
  const tmax=data.daily.temperature_2m_max;
  const rain=data.daily.precipitation_probability_max;
  
  box.innerHTML=`<div class="bg-fr-card border border-fr-bd rounded-xl p-3"><h2 class="font-bold text-sm mb-2">Meteo Live · ${w.name}</h2><div class="grid grid-cols-3 gap-2 text-center">`+
   days.map((d,i)=>`<div class="bg-fr-blk border border-fr-bd rounded-lg p-2"><div class="text-[10px] text-gray-400">${d}</div><div class="text-xl my-1">🌤️</div><div class="font-black text-xs">${tmax[i]}°C</div><div class="text-[10px] text-fr-yel">☔ ${rain[i]}%</div></div>`).join("")+`</div></div>`;
 }catch(e){
  box.innerHTML=`<div class="bg-fr-card border border-fr-bd rounded-xl p-4 text-center text-xs text-red-400">Impossibile caricare il meteo.</div>`;
 }
}

function setTab(t){
 curTab=t;
 ["prog","camp","wx","info"].forEach(x=>{
  document.getElementById("p-"+x).classList.toggle("on",x===t);
  document.getElementById("btn-"+x).className="py-3 text-xs font-bold border-t-2 "+(x===t?"text-fr-red border-fr-red":"text-gray-400 border-transparent");
 });
 if(t==="wx")renderWx();
}

renderWk();
</script>
</body>
</html>
